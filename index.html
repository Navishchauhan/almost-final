<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="landing">

<div class="petals"></div>

<div class="book-cover">
  <div class="book-content">
      <div class="emoji">🌹📖</div>
      
          <h1>Welcome, Tanu ✨✨</h1>
          
              <p>
                    On this day where we gift a book and a rose to a loved one, 
                          I thought of you My Volchonok 💖💖
                              </p>
                              
                                  <button onclick="openLibrary()">Open Book</button>
                                    </div>
                                    </div>
                                    
                                    <audio id="bgMusic" loop preload="auto">
                                      <source src="long-time.mp3" type="audio/mpeg">
                                      </audio>
                                      
                                      <script type="module" src="script.js"></script>
                                      
                                      <script>
                                      const music = document.getElementById("bgMusic");
                                      
                                      window.addEventListener("load", () => {
                                        document.body.classList.add('loaded');
                                        
                                          music.play().catch(() => {
                                              document.body.addEventListener("click", () => music.play(), { once: true });
                                                });
                                                });
                                                
                                                function openLibrary() {
                                                  document.querySelector('.book-cover').classList.add('open');
                                                    setTimeout(() => window.location.href = "library.html", 800);
                                                    }
                                                    </script>
                                                    
                                                    </body>
                                                    </html>
